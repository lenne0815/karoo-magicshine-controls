plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.lenne0815.karoosramsniffer'
    compileSdk 35

    base {
        archivesName = "karoo-sram-sniffer"
    }

    defaultConfig {
        applicationId "com.lenne0815.karoosramsniffer"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    buildFeatures {
        aidl true
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = '17'
    }
}

dependencies {
    implementation("io.hammerhead:karoo-ext:1.1.8")
    implementation files('libs/android_antlib_4-16-0.aar')
}
